# 随机端口，便于本地多实例/测试并行启动；本地验证可改为固定端口
server.port=0

# ===== 链路（observability.trace）=====
# 上游/下游使用的链路头名称，默认 W3C traceparent
observability.trace.header-name=traceparent
# 是否在响应头回写本次请求最终使用的 traceparent（便于客户端核对延续/新起）
observability.trace.response-header-enabled=true

# ===== 请求指标（observability.metrics）=====
# 指标标签组合（时间序列）数量硬上限；超过后新组合进入 __overflow__ 兜底桶并打一次错误日志
observability.metrics.max-series=200
# 归一化后路由标签的最大字符数，超出截断，保证标签长度有界
observability.metrics.route-max-length=128
